name: Build

# Pull requests: run the unit tests and check that the release APK compiles; nothing is kept.
# By hand ("Run workflow", any branch): also sign the APK with the fixed key and keep it for one day,
# to try a branch on the phone before merging. Published APKs come from release.yml.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # SHA-256 of the fixed signing certificate (public, not secret). An APK with another certificate
  # cannot be installed over the app on the phone.
  EXPECTED_CERT_SHA256: 80f3eb07a537585ed98b1461c9c488e441a2d1aa321ffb83443ff86b0c561ecb

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Also validates the Gradle wrapper jar and caches dependencies
      - uses: gradle/actions/setup-gradle@v6
      # Only for builds started by hand. The keystore comes from repository secrets and only exists on
      # the runner during the build.
      - name: Prepare signing key
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.EARACLE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.EARACLE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing secrets EARACLE_KEYSTORE_BASE64 / EARACLE_KEYSTORE_PASSWORD are not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/earacle-signing.p12"
          echo "EARACLE_KEYSTORE_FILE=$RUNNER_TEMP/earacle-signing.p12" >> "$GITHUB_ENV"
          echo "EARACLE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - run: ./gradlew testDebugUnitTest assembleRelease --stacktrace
      - name: Check signing certificate
        if: github.event_name == 'workflow_dispatch'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          CERT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "Certificate SHA-256: $CERT"
          if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::The APK is not signed with the fixed key."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: earacle-test-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1
